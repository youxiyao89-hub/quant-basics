[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "qbasics"
version = "0.1.0"
description = "Basic quantitative finance models on China A-share data, rebuilt from scratch as a learning log."
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
